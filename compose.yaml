services:
  allia-health-back:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allia-health-back
    ports:
      - 3000:3000
    networks:
      - dockernet
    restart: always
    depends_on:
      - db

  allia-health-front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: allia-health-front
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
    networks:
      - dockernet
    command: ["npm", "run", "dev"]
    depends_on:
      - allia-health-back
    restart: always

  db:
    image: postgres:16-alpine
    container_name: allia-health-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - dockernet

networks:
  dockernet:
    external: true

volumes:
  pgdata:
    driver: local
